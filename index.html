<!DOCTYPE html>

<head>
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div id="top">
            <h1 id="title">Todo List</h1>
            <div class="input-row">
                <div id="userinput">
                    <input type="text" id="todoinput">
                    <input type="date" id="datePicker">
                    <button id="addbutton">Add</button>
                </div>

                <div id="sorters">
                    <select id="sort" class="dropdown">
                        <option value="createdAt">Date Created</option>
                        <option value="dueDate">Due Date</option>
                        <option value="test">test</option>
                    </select>
                    <select id="sort-order" class="dropdown">
                        <option value="ascending">Ascending</option>
                        <option value="descending">Descending</option>
                        <option value="test">test</option>
                    </select>
                </div>

        </div>

        </div>
        
        <div id="categories">
            <div class="category-container">
                <h2 class="task-category">Doing</h2>
                <div class="category-tasks">
                    <div id="doing"></div>
                </div>
                
            </div>
            <div class="category-container">
                <h2 class="task-category">Completed</h2>
                <div class="category-tasks">
                    <div id="completed"></div>
                </div>
                
            </div>
        </div>
        

        <script>
            let tasks = JSON.parse(localStorage.getItem("tasks")) || []

            // document.body.style.backgroundColor = "beige"
            const todoinput = document.getElementById("todoinput")
            const addbutton = document.getElementById("addbutton")
            const doing = document.getElementById("doing")
            const completed = document.getElementById("completed")
            const datePicker = document.getElementById("datePicker")
            const sorter = document.getElementById("sort")
            const sorterorder = document.getElementById("sort-order")
            let order = 1

            function saveTasks() {
                localStorage.setItem("tasks", JSON.stringify(tasks))
            }

            function renderTasks() {
                doing.innerHTML = ""
                completed.innerHTML = ""
                const sortby = sorter.value
                if (sortby === 'createdAt') {
                    tasks.sort((a, b) => { //make completed sorts in completedAt
                        if (a.createdAt >= b.createdAt) {
                            return 1*order
                        } else {
                            return -1*order
                        }
                    })
                } else if (sortby === 'dueDate') {
                    tasks.sort((a, b) => {
                        if (!a.dueDate) return 1*order
                        if (!b.dueDate) return -1*order
                        if (a.dueDate > b.dueDate) {
                            return 1*order
                        } else {
                            return -1*order
                        }
                        return 
                    })
                }

                for (const task of tasks) {
                    if (sortby === 'dueDate' && !task.dueDate) {
                        continue
                    }
                    const newElement = document.createElement("p")
                    newElement.textContent = task.text
                    
                    // newElement.draggable = true

                    newElement.className = 'task'
                    const taskRow = document.createElement("div")
                    taskRow.className = "task-row"
                    const taskInfo = document.createElement("div")
                    taskInfo.className = "task-info"
                    

                    if (task.completed) {
                        newElement.className = 'task completed-task'
                        const newDelButton = document.createElement("button")
                        newDelButton.textContent = 'X'
                        newDelButton.className = 'delbutton'
                        const currentTask = task
                        taskRow.appendChild(newDelButton)
                        taskInfo.appendChild(newElement)
                        taskRow.appendChild(taskInfo)
                        completed.appendChild(taskRow)
                        newDelButton.addEventListener("click", () => {
                            tasks = tasks.filter(task => task.id !== currentTask.id)
                            saveTasks()
                            renderTasks()
                        })
                    } else {
                        
                        const newTickButton = document.createElement("button")
                        newTickButton.textContent = '✓'
                        newTickButton.className = 'tickbutton'
                        const currentTask = task
                        taskRow.appendChild(newTickButton)
                        taskInfo.appendChild(newElement)
                        taskRow.appendChild(taskInfo)
                        doing.appendChild(taskRow)
                        newTickButton.addEventListener("click", () => {
                            const task = tasks.find(task => task.id === currentTask.id)
                            task.completed = true
                            saveTasks()
                            renderTasks()
                            
                        })
                    
                    
                    // newElement.addEventListener("drag", () => console.log('drag'))
                    }
                    if (task.dueDate) {
                        const newDate = document.createElement("p")
                        const dueDate = new Date(task.dueDate)
                        newDate.className = 'date'
                        newDate.textContent = `Due: ${dueDate.getDate()}-${dueDate.getMonth()+1}-${dueDate.getFullYear()}`
                        taskInfo.appendChild(newDate)
                        // taskRow.appendChild(newDate)
                    }
                }
            }
        
            function putTask() {
                const todotext = todoinput.value.trim()
                const [year, month, day] = datePicker.value.split("-")
                const dueDate = new Date(year, month - 1, day)
                if (todotext === '') {
                    return
                }
                todoinput.value = ''
                tasks.push({id: crypto.randomUUID(), createdAt: Date.now(), dueDate:dueDate.getTime(), text: todotext, completed: false})
                saveTasks()
                renderTasks()
            }

            renderTasks()
            addbutton.addEventListener("click", () => {
                putTask()
            })

            todoinput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    putTask()
                }
            })

            sorter.addEventListener("change", () => {
                renderTasks()
            })

            sorterorder.addEventListener("change", () => { 
                if (sorterorder.value === 'ascending') {
                    order = 1
                } else if (sorterorder.value === 'descending') {
                    order = -1
                }
                renderTasks()
            })
        </script>
    </div>
    
</body>
